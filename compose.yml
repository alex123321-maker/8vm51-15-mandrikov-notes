name: 8vm51-15-mandrikov-lab12
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env from .env.example}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U notes -d notes']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: 8vm51-15-mandrikov-notes:v1
    build: .
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql://notes:${DB_PASSWORD}@db:5432/notes
      VERSION: v1
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
volumes:
  db-data:
